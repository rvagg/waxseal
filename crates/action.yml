name: Waxseal crates
description: Publish a crate to crates.io and attach it to an immutable GitHub release.

inputs:
  artifact-name:
    description: Name of the release artifact produced by this workflow run.
    required: false
    default: release-files-${{ github.run_id }}-${{ github.run_attempt }}
  package-directory:
    description: Repository-relative directory containing Cargo.toml and CHANGELOG.md.
    required: false
    default: '.'

outputs:
  package:
    description: Published crates.io package name.
    value: ${{ steps.identity.outputs.package }}
  version:
    description: Published version without the v prefix.
    value: ${{ steps.identity.outputs.version }}
  tag:
    description: Release tag.
    value: ${{ steps.identity.outputs.tag }}
  archive-sha256:
    description: SHA-256 of the crate archive.
    value: ${{ steps.validate.outputs.archive-sha256 }}
  release-url:
    description: URL of the published immutable GitHub release.
    value: ${{ steps.publish.outputs.release-url }}

runs:
  using: composite
  steps:
    - name: Require a GitHub-hosted Linux runner
      shell: bash
      run: |
        set -euo pipefail
        [[ "$RUNNER_OS" == Linux ]]
        [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]

    - name: Checkout the caller commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Check package and tag
      id: identity
      shell: bash
      env:
        WAXSEAL_SOURCE: ${{ github.workspace }}
        WAXSEAL_PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
      run: |
        set -euo pipefail
        /usr/bin/python3 -I "$GITHUB_ACTION_PATH/../scripts/publish-crate.py" identity \
          --source "$WAXSEAL_SOURCE" \
          --package-directory "$WAXSEAL_PACKAGE_DIRECTORY"

    - name: Check artifact workflow run and size
      id: artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WAXSEAL_SOURCE: ${{ github.workspace }}
        WAXSEAL_PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        WAXSEAL_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail
        /usr/bin/python3 -I "$GITHUB_ACTION_PATH/../scripts/publish-crate.py" artifact \
          --source "$WAXSEAL_SOURCE" \
          --package-directory "$WAXSEAL_PACKAGE_DIRECTORY" \
          --artifact-name "$WAXSEAL_ARTIFACT_NAME"

    - name: Download this run's release artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
        skip-decompress: true
        path: ${{ runner.temp }}/waxseal-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Check crate archive
      id: validate
      shell: bash
      env:
        WAXSEAL_SOURCE: ${{ github.workspace }}
        WAXSEAL_PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        WAXSEAL_FILES: ${{ runner.temp }}/waxseal-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -euo pipefail
        /usr/bin/python3 -I "$GITHUB_ACTION_PATH/../scripts/publish-crate.py" validate \
          --source "$WAXSEAL_SOURCE" \
          --package-directory "$WAXSEAL_PACKAGE_DIRECTORY" \
          --files "$WAXSEAL_FILES" --artifact-zip

    - name: Create GitHub attestation
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.validate.outputs.archive-path }}

    - name: Verify GitHub attestation
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WAXSEAL_SOURCE: ${{ github.workspace }}
        WAXSEAL_PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        WAXSEAL_FILES: ${{ steps.validate.outputs.files-directory }}
        WAXSEAL_EXPECTED_SHA256: ${{ steps.validate.outputs.archive-sha256 }}
      run: |
        set -euo pipefail
        /usr/bin/python3 -I "$GITHUB_ACTION_PATH/../scripts/publish-crate.py" verify-attestation \
          --source "$WAXSEAL_SOURCE" \
          --package-directory "$WAXSEAL_PACKAGE_DIRECTORY" \
          --files "$WAXSEAL_FILES" \
          --expected-sha256 "$WAXSEAL_EXPECTED_SHA256"

    - name: Authenticate to crates.io
      id: crates-io-auth
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

    - name: Publish crate and GitHub release
      id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        WAXSEAL_SOURCE: ${{ github.workspace }}
        WAXSEAL_PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        WAXSEAL_FILES: ${{ steps.validate.outputs.files-directory }}
        WAXSEAL_EXPECTED_SHA256: ${{ steps.validate.outputs.archive-sha256 }}
      run: |
        set -euo pipefail
        /usr/bin/python3 -I "$GITHUB_ACTION_PATH/../scripts/publish-crate.py" publish \
          --source "$WAXSEAL_SOURCE" \
          --package-directory "$WAXSEAL_PACKAGE_DIRECTORY" \
          --files "$WAXSEAL_FILES" \
          --expected-sha256 "$WAXSEAL_EXPECTED_SHA256"
